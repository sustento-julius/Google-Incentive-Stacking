name: Deploy 3 Mins Local to GitHub Pages

on:
  push:
    branches: ["claude/3-mins-local-pipeline-hAm9p", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp app.html _site/index.html
          cp app.html _site/app.html
          [ -f explainer.html ] && cp explainer.html _site/explainer.html || true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
